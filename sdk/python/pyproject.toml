[project]
name = "ce-cal"
version = "0.1.0"
description = "CAL, the cell auth language: parse, compile, explain and verify ce-net capability chains (C ABI build of the Rust crate)."
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.8"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ce_cal"]
