[package]
name = "ce-net-proto"
version = "0.1.0"
edition = "2024"
description = "The open ce-net capability token: Ed25519-signed, attenuating capability chains anyone can verify offline. Wire-compatible with ce-cap."
license = "Apache-2.0"
repository = "https://github.com/ce-net/ce-net-proto"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
sha2 = "0.10"
hex = "0.4"
# v3 P-256 keys (CAPABILITY-PROGRAMS.md section 2): ECDSA/SHA-256 sign and verify only.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
# v3 WebAuthn signatures (section 2): parse clientDataJSON.
serde_json = "1"

[[bin]]
name = "ce-cap-verify"
path = "src/bin/ce-cap-verify.rs"

[[bin]]
name = "ce-cal"
path = "src/bin/ce-cal.rs"

# The language SDKs: thin wrappers over `cal::api::call` (docs/CAL.md section 8).
[workspace]
members = [".", "sdk/ts", "sdk/python"]
# compat/ needs the ce repo next to this one: `cargo test --manifest-path compat/Cargo.toml`
exclude = ["compat"]
